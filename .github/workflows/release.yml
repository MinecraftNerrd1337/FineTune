name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # The maintainer's own Mac, started with the runner's ./run.sh when releasing: GitHub's macOS
    # runners are too scarce to count on. Only tag pushes run here, never pull requests.
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the update key is this fork's
        run: |
          # Every copy built with a wrong key refuses all the updates that follow: the key must be
          # this fork's Sparkle public key, an Ed25519 key of 32 bytes in base64
          KEY=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" FineTune/Info.plist)
          if [ "$KEY" = "xExSoQmCLDCez0KyhZ9EM9PdOZFZgyX/+VF+OVrpIlo=" ]; then
            echo "::error::SUPublicEDKey in FineTune/Info.plist is still the upstream key. Run Sparkle's generate_keys, put the public key there and the private key in the SPARKLE_PRIVATE_KEY secret."
            exit 1
          fi
          BYTES=$(printf '%s' "$KEY" | base64 --decode 2>/dev/null | wc -c | tr -d ' ')
          if [ "$BYTES" != "32" ]; then
            echo "::error::SUPublicEDKey in FineTune/Info.plist ($KEY) is not a Sparkle public key. Print yours with Sparkle's generate_keys -p."
            exit 1
          fi

      # The Xcode xcode-select points to on this Mac: choosing another one would need sudo
      - name: Show Xcode
        run: xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install create-dmg dependencies
        run: command -v gm >/dev/null || brew install graphicsmagick imagemagick

      # The app is signed with this fork's own self-signed certificate, not an Apple Developer
      # ID: the same identity on every release keeps the audio recording permission and lets
      # Sparkle accept the next update. The app is not notarized, so macOS asks once, at first
      # launch, to open it from Privacy & Security.
      - name: Import signing certificate
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          # Decode certificate
          echo "$SIGNING_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Create temporary keychain. create-keychain adds it to the Mac's keychain search list:
          # the list is put back as it was, and codesign is pointed at the keychain
          ORIGINAL_KEYCHAINS=$(security list-keychains -d user | xargs)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s $ORIGINAL_KEYCHAINS
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate to keychain
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the certificate
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Verify certificate is available (a self-signed one is listed, though not as "valid")
          security find-identity -p codesigning "$KEYCHAIN_PATH"

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Setting version to $VERSION"

          # Update MARKETING_VERSION (e.g., 1.1.0)
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $VERSION/g" FineTune.xcodeproj/project.pbxproj

          # Update CURRENT_PROJECT_VERSION (build number) using run number for uniqueness
          BUILD_NUMBER=${{ github.run_number }}
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" FineTune.xcodeproj/project.pbxproj

          echo "Version: $VERSION, Build: $BUILD_NUMBER"

      - name: Build archive
        run: |
          # Signed to run locally here, then with the fork's certificate below. No hardened
          # runtime: without a Team ID, its library validation would refuse Sparkle's framework.
          xcodebuild -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Release \
            -archivePath build/FineTune.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO

      - name: Sign app
        env:
          CERT_IDENTITY: ${{ secrets.CERT_IDENTITY }}
        run: |
          cp -R build/FineTune.xcarchive/Products/Applications/FineTune.app build/
          APP=build/FineTune.app

          # Each piece keeps its identifier and entitlements; inner code first, the app last
          sign() {
            codesign --force --sign "$CERT_IDENTITY" --keychain "$RUNNER_TEMP/build.keychain" --timestamp=none \
              --preserve-metadata=identifier,entitlements "$1"
          }
          # Sparkle's loose helper, then the nested bundles, deepest first
          find "$APP/Contents/Frameworks" -type f -path "*/Versions/*/Autoupdate" -print0 |
            while IFS= read -r -d '' item; do sign "$item"; done
          find "$APP/Contents" -depth -mindepth 1 -not -path "*/Contents/Resources/*" \
            \( -name "*.xpc" -o -name "*.app" -o -name "*.appex" -o -name "*.framework" -o -name "*.dylib" \) -print0 |
            while IFS= read -r -d '' item; do sign "$item"; done
          sign "$APP"

          # Verify the app is signed
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP"

          # One download for every Mac: the app must hold both Apple silicon and Intel code
          ARCHS=$(lipo -archs build/FineTune.app/Contents/MacOS/FineTune)
          echo "Architectures: $ARCHS"
          case "$ARCHS" in
            *arm64*x86_64*|*x86_64*arm64*) ;;
            *) echo "::error::FineTune.app is not universal ($ARCHS)"; exit 1 ;;
          esac

      - name: Create DMG
        run: |
          # create-dmg creates a nicely formatted DMG with Applications symlink
          npx create-dmg build/FineTune.app build/ --overwrite || true

          DMG_NAME="FineTune.dmg"

          # Find and rename the created DMG (create-dmg names it "AppName Version.dmg")
          mv build/*.dmg "build/${DMG_NAME}"

          echo "DMG_NAME=${DMG_NAME}" >> $GITHUB_ENV
          echo "Created: build/${DMG_NAME}"

      - name: Update appcast with Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          # Download Sparkle tools
          SPARKLE_VERSION="2.8.1"
          curl -L -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle_tools
          tar -xf sparkle.tar.xz -C sparkle_tools

          # Write private key to temp file (generate_appcast reads from file)
          echo -n "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_private_key"

          # Create Release folder with the DMG (generate_appcast scans this folder)
          mkdir -p Release
          cp "build/$DMG_NAME" "Release/"

          # Run generate_appcast to update appcast.xml with proper EdDSA signature
          sparkle_tools/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle_private_key" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/" \
            -o appcast.xml \
            Release/

          # Clean up private key
          rm -f "$RUNNER_TEMP/sparkle_private_key"

          echo "Updated appcast.xml with version ${VERSION}"
          cat appcast.xml

      - name: Commit updated appcast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for ${GITHUB_REF_NAME}" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/FineTune.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove the temporary keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"
